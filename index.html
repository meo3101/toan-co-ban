<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài toán cơ bản</title>
</head>

<body>

    <h1>Bài toán tính tổng 2 số</h1>

    <label>Nhập số A:</label>
    <input type="number" id="soA">

    <br><br>

    <label>Nhập số B:</label>
    <input type="number" id="soB">

    <br><br>

    <button onclick="tinhTong()">Tính tổng</button>

    <h2 id="ketQua"></h2>

    <script>
        function tinhTong() {
            let a = Number(document.getElementById("soA").value);
            let b = Number(document.getElementById("soB").value);

            let tong = a + b;

            document.getElementById("ketQua").innerHTML =
                "Kết quả: " + tong;
        }
    </script>

</body>
</html>
