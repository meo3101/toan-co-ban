<!DOCTYPE html>
<html>
<head>
    <title>Tính tổng</title>
</head>

<body>

    <h1>Tính tổng 2 số</h1>

    <input type="number" id="a" placeholder="Nhập số A">
    <input type="number" id="b" placeholder="Nhập số B">

    <button onclick="tinh()">Tính</button>

    <p id="kq"></p>

    <script>
        function tinh() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);

            document.getElementById("kq").innerHTML = a + b;
        }
    </script>

</body>
</html>
